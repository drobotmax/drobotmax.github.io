<!doctype html>
<html lang="ru">
<head>

<title>Отчёт переехал</title>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center;
         justify-content: center; background: #f6f7f9; color: #1c1d1f;
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .card { max-width: 32rem; margin: 1.5rem; padding: 2.5rem; background: #fff;
          border-radius: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06); }
  h1 { margin: 0 0 1rem; font-size: 1.375rem; font-weight: 600; }
  p { margin: 0 0 1rem; color: #45474a; }
  a.btn { display: inline-block; margin-top: .25rem; padding: .7rem 1.25rem;
          background: #2a5e45; color: #fff; border-radius: 8px; text-decoration: none; }
  a.btn:hover { background: #347a57; }
  .note { margin: 1.5rem 0 0; font-size: .875rem; color: #76797d; }
</style>
</head>
<body>
  <div class="card">
    <h1>Отчёт по сквозной аналитике переехал</h1>
    <p>Теперь он обновляется автоматически каждый день и живёт по новому адресу:</p>
    <p><a class="btn" href="https://metry.kubrik.pro/skvoznaya/">metry.kubrik.pro/skvoznaya/</a></p>
    <p class="note">При открытии браузер спросит логин и пароль - те же, что для отчёта
    РНП и отчёта по качеству звонков. Старый адрес больше не обновляется, сохраните новый.</p>
  </div>
